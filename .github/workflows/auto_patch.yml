name: Auto Patch Official Windows Server 2022 ISO to 20348 Client

on:
  workflow_dispatch:
  schedule:
    # Runs automatically on the 15th of every month (after Patch Tuesday monthly ISO refresh)
    - cron: '0 4 15 * *'

permissions:
  contents: write

jobs:
  build-official-client-iso:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Official Server 2022 -> 20348 Client Native DISM/CBS Builder
        id: build
        shell: pwsh
        run: |
          .\Patch-Official-Server2022-ISO.ps1 -WorkDir "D:\work_20348" -OutputDir "D:\output_20348"

      - name: Upload Full Single-File ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.iso_name }}
          path: ${{ steps.build.outputs.iso_path }}
          compression-level: 0
          retention-days: 30

      - name: Prepare Release Volumes (< 2 GiB per GitHub Release Asset) & Checksums
        shell: pwsh
        run: |
          $isoPath = "${{ steps.build.outputs.iso_path }}"
          $isoName = "${{ steps.build.outputs.iso_name }}"
          $isoSha  = "${{ steps.build.outputs.iso_sha256 }}"
          $outDir  = Split-Path $isoPath -Parent

          $sumsPath = Join-Path $outDir "SHA256SUMS.txt"
          "$isoSha  $isoName" | Out-File -FilePath $sumsPath -Encoding ascii

          # Split into 1900MB volumes (-mx0 store mode for instant splitting) for GitHub Releases (2 GiB asset limit)
          7z.exe a -t7z -mx=0 -v1900m "$outDir\$isoName.7z" "$isoPath"
          if ($LASTEXITCODE -ne 0) { throw "7z volume split failed" }

          Get-ChildItem "$outDir\$isoName.7z.*" | ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$h  $($_.Name)" | Out-File -FilePath $sumsPath -Append -Encoding ascii
          }
          Get-Content $sumsPath

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $buildVer = "${{ steps.build.outputs.build_ver }}"
          $isoName  = "${{ steps.build.outputs.iso_name }}"
          $isoSha   = "${{ steps.build.outputs.iso_sha256 }}"
          $outDir   = Split-Path "${{ steps.build.outputs.iso_path }}" -Parent
          $tagName  = "v$buildVer"

          $notes = @"
          ## Windows 10 (Build $buildVer / Fe 20348) Client Multi-Edition ISO (x64, zh-CN)

          **100% Native DISM / CBS Servicing Reconstruction from Official Microsoft Sources**:
          - **Base OS & Monthly LCU**: Official Microsoft Windows Server 2022 Monthly Updated ISO (`$buildVer`, fetched & SHA-256 verified via `ntriver.org`)
          - **100% Native DISM / CBS Servicing (Zero Handcrafted Post-Hoc `.reg` Injection)**:
            - Stages and installs all 17 official Microsoft UUP `20348.1` (`2ba1d737-a36b-415b-a630-85bd5146d77d`) Client ESD packages + 5 `zh-CN` LanguageFeatures FOD CABs via `dism.exe /Apply-Unattend` and `dism.exe /Set-Edition`.
            - Full Lifecycle Monthly LCU Update Support (`$buildVer`): OS Core, Shell (`explorer.exe`, `shell32.dll`, `dwmcore.dll`, `udwm.dll`), Bluetooth (`BthEnum.sys`, `bthport.sys`), and Media Foundation (`mfplat.dll`, `mfcore.dll`) all remain at the latest LCU version and support future monthly cumulative updates.
            - Default Client Visual Effects Enabled Out-of-the-Box (`VisualFXSetting = 1`), pure Client `WinNT` ProductType (`Win32PrioritySeparation = 2`), and pre-enabled `.NET Framework 3.5 (NetFx3)`.

          ### Included Editions (`sources\install.wim`)
          1. **Windows 10 IoT Enterprise** (`IoTEnterprise` — Clean LTSC-style Edition without Consumer UWP Bloat)
          2. **Windows 10 Pro** (`Professional` — Full Official Microsoft Store & 41 Modern UWP Apps Provisioned)
          3. **Windows 10 Pro for Workstations** (`ProfessionalWorkstation` — Native `dism /Set-Edition:ProfessionalWorkstation`)
          4. **Windows 10 Enterprise** (`Enterprise` — Native `dism /Set-Edition:Enterprise`)

          ### Verification
          - **ISO Filename**: `$isoName`
          - **ISO SHA-256**: `$isoSha`
          - Extract `.iso.7z.001` with 7-Zip to obtain the full bootable ISO (or download the single-file ISO directly from the Workflow Run Artifacts).
          "@

          $existing = gh release view $tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
              gh release delete $tagName --yes --cleanup-tag
          }
          $assets = @("$outDir\SHA256SUMS.txt") + (Get-ChildItem "$outDir\$isoName.7z.*").FullName
          gh release create $tagName @assets --title "Windows 20348 Client ($buildVer) Official Native DISM ISO" --notes $notes
