name: Auto Patch Official Windows Server 2022 ISO to 20348 Client

on:
  workflow_dispatch:
  schedule:
    # Runs automatically on the 15th of every month (after Patch Tuesday monthly ISO refresh)
    - cron: '0 4 15 * *'

permissions:
  contents: write

jobs:
  build-official-client-iso:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Official Server 2022 -> 20348 Client Patcher (100% Microsoft Sources)
        id: build
        shell: pwsh
        run: |
          .\Patch-Official-Server2022-ISO.ps1 -WorkDir "D:\work_20348" -OutputDir "D:\output_20348"

      - name: Upload Full Single-File ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.iso_name }}
          path: ${{ steps.build.outputs.iso_path }}
          compression-level: 0
          retention-days: 30

      - name: Prepare Release Volumes (< 2 GiB per GitHub Release Asset) & Checksums
        shell: pwsh
        run: |
          $isoPath = "${{ steps.build.outputs.iso_path }}"
          $isoName = "${{ steps.build.outputs.iso_name }}"
          $isoSha  = "${{ steps.build.outputs.iso_sha256 }}"
          $outDir  = Split-Path $isoPath -Parent

          $sumsPath = Join-Path $outDir "SHA256SUMS.txt"
          "$isoSha  $isoName" | Out-File -FilePath $sumsPath -Encoding ascii

          # Split into 1900MB volumes (-mx0 store mode for instant splitting) for GitHub Releases (2 GiB asset limit)
          7z.exe a -t7z -mx=0 -v1900m "$outDir\$isoName.7z" "$isoPath"
          if ($LASTEXITCODE -ne 0) { throw "7z volume split failed" }

          Get-ChildItem "$outDir\$isoName.7z.*" | ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$h  $($_.Name)" | Out-File -FilePath $sumsPath -Append -Encoding ascii
          }
          Get-Content $sumsPath

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $buildVer = "${{ steps.build.outputs.build_ver }}"
          $isoName  = "${{ steps.build.outputs.iso_name }}"
          $isoSha   = "${{ steps.build.outputs.iso_sha256 }}"
          $outDir   = Split-Path "${{ steps.build.outputs.iso_path }}" -Parent
          $tagName  = "v$buildVer"

          $notes = @"
          ## Windows 10 (Build $buildVer / Fe 20348) Client Multi-Edition ISO (x64, zh-CN)

          **Full Client Reconstruction from Official Microsoft Sources**:
          - **Base OS & Monthly LCU**: Official Microsoft Windows Server 2022 Monthly Updated ISO (`$buildVer`, fetched & SHA-256 verified via `ntriver.org`)
          - **Full Client CBS Packages & WinSxS Components**: Injected 581 Client CBS Packages (`Microsoft-Windows-EnterpriseSEdition`, `Microsoft-Windows-ProfessionalEdition`, Client Features & Svchost Service Groups)
          - **71 Client Hardware Drivers & 99 Client Services Pre-Registered (`DRIVERS` & `SYSTEM` Hives)**:
            - **12 Laptop Precision Touchpad I2C / GPIO Host Controller Drivers**: Intel Serial IO (`iai2c.inf`, `iagpio.inf`, `ialpss2i_i2c_*.inf`, `ialpss2i_gpio2_*.inf`) & AMD (`amdi2c.inf`, `amdgpio2.inf`)
            - **7 Bluetooth Audio Drivers**: A2DP Sink/Source (`BthA2dp.sys`), AVRCP Transport (`Microsoft.Bluetooth.AvrcpTransport.sys`), Hands-Free Profile & Audio Gateway (`BthHfAud.sys`, `BthHfEnum.sys`, `BthAvctpSvc`, `BTAGService`, `BluetoothUserService`)
            - **44 Desktop Wireless Wi-Fi Adapter Drivers & 4 Xbox Controller Drivers**: Intel Wi-Fi (`netwtw02/04/06/08.inf`), Realtek (`netrtwlane*.inf`), Qualcomm Atheros (`athw8x.inf`), Broadcom (`bcmdhd64.inf`), Xbox GIP/HID (`xboxgip.inf`, `xinputhid.inf`, `xusb22.inf`)
          - **Pre-Enabled `.NET Framework 3.5 (NetFx3)`**: Enabled by default out-of-the-box via official `sources\sxs` CAB.

          ### Included Editions (`sources\install.wim`)
          1. **Windows 10 Enterprise LTSC 2021** (`EnterpriseS`)
          2. **Windows 10 IoT Enterprise LTSC 2021** (`IoTEnterpriseS`)
          3. **Windows 10 Pro** (`Professional`)
          4. **Windows 10 Enterprise** (`Enterprise`)

          ### Verification
          - **ISO Filename**: `$isoName`
          - **ISO SHA-256**: `$isoSha`
          - Extract `.iso.7z.001` with 7-Zip to obtain the full bootable ISO (or download the single-file ISO directly from the Workflow Run Artifacts).
          "@

          $existing = gh release view $tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
              gh release delete $tagName --yes --cleanup-tag
          }
          $assets = @("$outDir\SHA256SUMS.txt") + (Get-ChildItem "$outDir\$isoName.7z.*").FullName
          gh release create $tagName @assets --title "Windows 20348 Client ($buildVer) Official Patch ISO" --notes $notes
